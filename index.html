<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzeWeb — Every Business Deserves a Kingdom Online</title>
<meta name="description" content="Build a free professional website for your Nigerian business in under 60 seconds. Powered by AI. No coding needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #C9922A;
  --gold-light: #E8B84B;
  --gold-pale: #F5E6C8;
  --ink: #0D0B08;
  --ink2: #1A1612;
  --ink3: #2A2420;
  --warm: #F7F3EE;
  --warm2: #EDE5D8;
  --muted: #8A7D6E;
  --green: #2A7D5A;
  --green-light: #3AAD7A;
  --red: #C0392B;
  --white: #FFFFFF;
  --shadow: 0 20px 60px rgba(13,11,8,0.15);
  --shadow-gold: 0 8px 30px rgba(201,146,42,0.25);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--warm);
  color: var(--ink);
  overflow-x: hidden;
  cursor: default;
}

/* ── CUSTOM CURSOR ── */
.cursor {
  width: 12px; height: 12px;
  background: var(--gold);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s, width 0.3s, height 0.3s, opacity 0.3s;
  mix-blend-mode: multiply;
}
.cursor-ring {
  width: 36px; height: 36px;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: transform 0.15s ease-out, width 0.3s, height 0.3s, opacity 0.3s;
  opacity: 0.5;
}

/* ── NOISE TEXTURE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
  opacity: 0.4;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 500;
  padding: 0 5vw;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(247,243,238,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(201,146,42,0.15);
  transition: all 0.3s;
}
nav.scrolled {
  background: rgba(247,243,238,0.97);
  box-shadow: 0 4px 30px rgba(13,11,8,0.08);
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--ink);
  text-decoration: none;
}
.nav-logo span { color: var(--gold); }
.nav-logo em {
  font-style: normal;
  font-size: 10px;
  font-family: 'Outfit', sans-serif;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  display: block;
  margin-top: -4px;
}
.nav-cta {
  background: var(--ink);
  color: var(--warm);
  padding: 10px 24px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 0.3px;
  transition: all 0.3s;
  border: none;
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
}
.nav-cta:hover { background: var(--gold); color: var(--ink); transform: translateY(-1px); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 5vw 80px;
  position: relative;
  overflow: hidden;
  background: var(--ink);
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,146,42,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(201,146,42,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 40% 60% at 10% 60%, rgba(201,146,42,0.06) 0%, transparent 50%);
}

.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,146,42,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,146,42,0.06) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(201,146,42,0.12);
  border: 1px solid rgba(201,146,42,0.25);
  color: var(--gold-light);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 8px 20px;
  border-radius: 100px;
  margin-bottom: 40px;
  position: relative;
  z-index: 2;
  animation: fadeDown 1s ease both;
}
.hero-eyebrow::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--gold-light);
  border-radius: 50%;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(52px, 10vw, 110px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -2px;
  color: var(--warm);
  position: relative;
  z-index: 2;
  animation: fadeUp 1s ease 0.2s both;
  margin-bottom: 8px;
}
.hero-title .gold-text {
  color: var(--gold-light);
  font-style: italic;
}
.hero-title .outline-text {
  -webkit-text-stroke: 1.5px rgba(247,243,238,0.4);
  color: transparent;
}

.hero-subtitle {
  font-size: clamp(16px, 2.5vw, 20px);
  color: rgba(247,243,238,0.55);
  max-width: 560px;
  line-height: 1.7;
  font-weight: 300;
  position: relative;
  z-index: 2;
  animation: fadeUp 1s ease 0.4s both;
  margin-top: 24px;
  margin-bottom: 48px;
}
.hero-subtitle strong { color: rgba(247,243,238,0.9); font-weight: 500; }

.hero-btns {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  position: relative;
  z-index: 2;
  animation: fadeUp 1s ease 0.6s both;
  margin-bottom: 64px;
}
.btn-hero-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--ink);
  padding: 16px 36px;
  border-radius: 100px;
  font-weight: 700;
  font-size: 15px;
  border: none;
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  transition: all 0.3s;
  box-shadow: 0 8px 30px rgba(201,146,42,0.35);
  letter-spacing: 0.3px;
}
.btn-hero-primary:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(201,146,42,0.45); }
.btn-hero-secondary {
  background: transparent;
  color: rgba(247,243,238,0.7);
  padding: 16px 36px;
  border-radius: 100px;
  font-weight: 500;
  font-size: 15px;
  border: 1px solid rgba(247,243,238,0.15);
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  transition: all 0.3s;
}
.btn-hero-secondary:hover { border-color: rgba(247,243,238,0.4); color: var(--warm); }

/* Stats row */
.hero-stats {
  display: flex;
  gap: 0;
  position: relative;
  z-index: 2;
  animation: fadeUp 1s ease 0.8s both;
  border: 1px solid rgba(201,146,42,0.15);
  border-radius: 20px;
  overflow: hidden;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
}
.hero-stat {
  padding: 24px 40px;
  text-align: center;
  position: relative;
}
.hero-stat:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0; top: 20%; bottom: 20%;
  width: 1px;
  background: rgba(201,146,42,0.15);
}
.hero-stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  font-weight: 700;
  color: var(--gold-light);
  display: block;
  line-height: 1;
  margin-bottom: 6px;
}
.hero-stat-label {
  font-size: 11px;
  color: rgba(247,243,238,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 400;
}

/* Scroll indicator */
.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(247,243,238,0.3);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 2;
  animation: fadeUp 1s ease 1.2s both;
}
.scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, rgba(201,146,42,0.6), transparent);
  animation: scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%, 100% { opacity: 0.3; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(0.7); }
}

/* ── HOW IT WORKS ── */
.section {
  padding: 100px 5vw;
  position: relative;
}
.section-inner { max-width: 1100px; margin: 0 auto; }

.section-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
}
.section-tag::before { content: '✦'; font-size: 8px; }

.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 5vw, 60px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -1px;
  margin-bottom: 16px;
}
.section-sub {
  font-size: 17px;
  color: var(--muted);
  max-width: 520px;
  line-height: 1.7;
  font-weight: 300;
}

/* Steps */
.steps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-top: 60px;
  background: var(--warm2);
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid var(--warm2);
}
.step-card {
  background: var(--warm);
  padding: 48px 36px;
  position: relative;
  transition: all 0.3s;
}
.step-card:hover { background: var(--white); }
.step-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 72px;
  font-weight: 700;
  color: var(--gold-pale);
  line-height: 1;
  margin-bottom: 20px;
  display: block;
  transition: color 0.3s;
}
.step-card:hover .step-num { color: var(--gold); }
.step-icon { font-size: 32px; margin-bottom: 16px; display: block; }
.step-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
.step-desc { font-size: 15px; color: var(--muted); line-height: 1.7; font-weight: 300; }

/* ── FORM SECTION ── */
.form-section-wrap {
  background: var(--ink);
  position: relative;
  overflow: hidden;
}
.form-section-wrap::before {
  content: '';
  position: absolute;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(201,146,42,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.form-section-wrap::after {
  content: '';
  position: absolute;
  bottom: -200px; left: -200px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(201,146,42,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.form-container {
  max-width: 780px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.form-header { text-align: center; margin-bottom: 56px; }
.form-header .section-tag { color: var(--gold-light); justify-content: center; }
.form-header .section-title { color: var(--warm); }
.form-header .section-sub { color: rgba(247,243,238,0.5); margin: 0 auto; }

/* Progress */
.progress-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-bottom: 48px;
}
.prog-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.prog-circle {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.3);
  transition: all 0.4s;
  position: relative;
  z-index: 1;
}
.prog-circle.active {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--ink);
  box-shadow: 0 0 0 6px rgba(201,146,42,0.15);
}
.prog-circle.done {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.prog-label {
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 500;
  transition: color 0.4s;
}
.prog-label.active { color: var(--gold-light); }
.prog-line {
  width: 80px; height: 1px;
  background: rgba(255,255,255,0.1);
  margin-bottom: 22px;
  transition: background 0.4s;
}
.prog-line.done { background: var(--green); }

/* Form card */
.form-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 48px;
  backdrop-filter: blur(10px);
}

.form-step { display: none; }
.form-step.active { display: block; animation: fadeUp 0.5s ease both; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.field-row.solo { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field.full { grid-column: span 2; }

.field label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(247,243,238,0.4);
}
.field label .req { color: var(--gold-light); }

.field input,
.field textarea,
.field select {
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 15px 20px;
  color: var(--warm);
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 300;
  outline: none;
  transition: all 0.25s;
  width: 100%;
  -webkit-appearance: none;
}
.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--gold);
  background: rgba(201,146,42,0.06);
  box-shadow: 0 0 0 4px rgba(201,146,42,0.08);
}
.field input::placeholder,
.field textarea::placeholder { color: rgba(247,243,238,0.2); }
.field textarea { resize: vertical; min-height: 110px; }
.field select option { background: #1A1612; color: var(--warm); }

/* Color picker */
.color-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(247,243,238,0.4);
  margin-bottom: 12px;
  display: block;
}
.swatches {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.swatch {
  width: 40px; height: 40px;
  border-radius: 12px;
  cursor: pointer;
  border: 3px solid transparent;
  outline: 2px solid transparent;
  transition: all 0.25s;
  position: relative;
}
.swatch:hover { transform: scale(1.1); }
.swatch.selected {
  border-color: rgba(255,255,255,0.9);
  outline-color: rgba(255,255,255,0.3);
  transform: scale(1.15);
}
.swatch.selected::after {
  content: '✓';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 15px;
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

/* Form actions */
.form-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 36px;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.btn-back {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4);
  padding: 13px 24px;
  border-radius: 100px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-back:hover { border-color: rgba(255,255,255,0.3); color: var(--warm); }
.btn-next {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--ink);
  padding: 15px 36px;
  border-radius: 100px;
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: var(--shadow-gold);
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(201,146,42,0.45); }
.btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── LOADING ── */
.loading-overlay {
  display: none;
  text-align: center;
  padding: 64px 20px;
}
.loading-overlay.active { display: block; animation: fadeUp 0.5s ease both; }

.loader-wrap {
  position: relative;
  width: 80px; height: 80px;
  margin: 0 auto 32px;
}
.loader-ring-outer {
  width: 80px; height: 80px;
  border: 2px solid rgba(201,146,42,0.15);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
  position: absolute; inset: 0;
}
.loader-ring-inner {
  width: 56px; height: 56px;
  border: 2px solid rgba(201,146,42,0.08);
  border-bottom-color: var(--gold-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite reverse;
  position: absolute;
  top: 12px; left: 12px;
}
.loader-icon {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--warm);
  margin-bottom: 8px;
}
.loading-sub { font-size: 14px; color: rgba(247,243,238,0.4); margin-bottom: 36px; font-weight: 300; }

.load-steps { list-style: none; max-width: 320px; margin: 0 auto; }
.load-step {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  border-radius: 12px;
  margin-bottom: 8px;
  transition: all 0.4s;
  color: rgba(247,243,238,0.25);
  font-size: 14px;
  font-weight: 400;
}
.load-step.active {
  background: rgba(201,146,42,0.08);
  color: var(--warm);
  border: 1px solid rgba(201,146,42,0.15);
}
.load-step.done { color: var(--green-light); }
.ls-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

/* ── RESULT ── */
.result-overlay {
  display: none;
  animation: fadeUp 0.6s ease both;
}
.result-overlay.active { display: block; }

.result-crown {
  text-align: center;
  padding: 40px 0 32px;
}
.crown-emoji {
  font-size: 64px;
  display: block;
  animation: crownBounce 1s ease both;
  margin-bottom: 16px;
}
@keyframes crownBounce {
  0% { transform: translateY(-40px) scale(0.5); opacity: 0; }
  60% { transform: translateY(10px) scale(1.1); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.result-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 700;
  color: var(--warm);
  margin-bottom: 8px;
}
.result-sub { font-size: 15px; color: rgba(247,243,238,0.5); font-weight: 300; }

.url-reveal {
  background: rgba(42,125,90,0.1);
  border: 1px solid rgba(42,125,90,0.3);
  border-radius: 18px;
  padding: 24px 28px;
  margin: 28px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.url-left .url-label {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green-light);
  font-weight: 600;
  margin-bottom: 6px;
}
.url-value {
  font-family: 'Outfit', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--warm);
  word-break: break-all;
}
.url-btns { display: flex; gap: 8px; flex-shrink: 0; }
.url-btn {
  padding: 10px 18px;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.url-btn-copy {
  background: rgba(255,255,255,0.08);
  color: var(--warm);
  border: 1px solid rgba(255,255,255,0.1);
}
.url-btn-copy:hover { background: rgba(255,255,255,0.15); }
.url-btn-open {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--ink);
}
.url-btn-open:hover { transform: translateY(-1px); box-shadow: var(--shadow-gold); }

  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 24px;
}

  background: rgba(255,255,255,0.05);
  padding: 12px 18px;

}
