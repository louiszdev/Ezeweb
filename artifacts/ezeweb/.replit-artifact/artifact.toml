kind = "web"
previewPath = "/"
title = "EzeWeb"
version = "1.0.0"
id = "artifacts/ezeweb"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21729

[services.development]
run = "pnpm --filter @workspace/ezeweb run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ezeweb", "run", "build" ]
publicDir = "artifacts/ezeweb/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21729"
BASE_PATH = "/"
